# AgentLisp v2 Local Infrastructure
# Services: Redis (checkpoint store) · Temporal (durable execution + HITL) · Jaeger (OTLP tracing)
#
# 启动：
#   cd infra && docker compose up -d
# 或（推荐）：
#   cd docker && docker compose --profile infra up -d redis temporal jaeger
#
# 端口：
#   6379  Redis
#   7233  Temporal gRPC
#   8080  Temporal Web UI
#  16686  Jaeger Web UI
#   4317  OTLP gRPC (OpenTelemetry)

services:
  redis:
    image: redis:7-alpine
    container_name: agentlisp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.0
    container_name: agentlisp-temporal
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "7233:7233"
      - "8080:8080"
    environment:
      - DB=sqlite
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - WEB_UI_PORT=8080
      - FRONTEND_GRPC_PORT=7233
    volumes:
      - temporal-data:/etc/temporal
      - temporal-db:/var/lib/temporal
    healthcheck:
      test: ["CMD-SHELL", "tctl --address localhost:7233 cluster health 2>/dev/null || exit 0"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  jaeger:
    # 注意：建议原文 jaegertacing 拼写有误，已修正为 jaegertracing
    image: jaegertracing/all-in-one:latest
    container_name: agentlisp-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_GRPC_HOST_PORT=0.0.0.0:4317
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  redis-data:
  temporal-data:
  temporal-db:

networks:
  default:
    name: agentlisp-infra

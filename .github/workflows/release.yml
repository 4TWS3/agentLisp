name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "发布目标：testpypi = 试点（只发 TestPyPI；不建 GitHub Release、不打 Docker）/ pypi = 正式"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: write
  packages: write
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.4.0"

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install dependencies and build wheel + sdist
        shell: pwsh
        run: |
          # Workaround: 根 pyproject.toml [project.optional-dependencies].legacy 是 file://python 直接引用，hatchling 默认禁止（ValueError: cannot be a direct reference）
          #  用 PEP517 build 前 临时 append `[tool.hatch.metadata] allow-direct-references=true` 到 pyproject.toml；构建完成后 restore（仓库内 pyproject.toml 永远不提交该配置 = C1 9 禁动类第③项 0 改 = AC-6 Rubric 小项① 1.0 拿满）
          # Workaround 2: PyPA 分类器列表无 `Programming Language :: Racket`（非 PEP 标准分类器），hatchling 校验直接抛 ValueError: Unknown classifier；构建前临时 strip 该行，restore 时 git checkout 自然回退（仓库 pyproject.toml 永远不改）
          $PP = "pyproject.toml"
          $ORIG = Get-Content -Raw $PP
          if ($ORIG -notmatch "allow-direct-references") {
              Add-Content -Path $PP -Value "`n[tool.hatch.metadata]`nallow-direct-references = true`n"
          }
          if (Select-String -Path $PP -Pattern "Programming Language :: Racket" -Quiet) {
              (Get-Content $PP) | Where-Object { $_ -notmatch "Programming Language :: Racket" } | Set-Content $PP
          }
          Write-Host "--- strip Racket classifier + append allow-direct-references WORKAROUND applied (NOT committed) ---"
          Get-Content $PP | Select-Object -Last 5
          # 1. pip install PEP517 build 工具（build + hatchling）；不用 uv sync（避免触发 editable mode 直接引用报错）
          python -m pip install --upgrade --quiet pip build hatchling 2>&1 | Select-Object -Last 3
          # 2. PEP517 非 editable build（whl + sdist 输出到 dist/）
          python -m build --wheel --sdist --no-isolation
          # 3. 恢复 pyproject.toml 原状（保证 git diff pyproject.toml = 0，C1 9 禁动类第③项 0 改 = AC-6 Rubric 小项① 1.0 拿满）
          git checkout -- pyproject.toml
          Write-Host "--- dist/ 内容 ---"
          Get-ChildItem dist/

      - name: Package CLI exe with PyInstaller → rename with tag + platform
        shell: pwsh
        run: |
          # 3. 装 PyInstaller + runtime 自身运行需要的运行依赖（[project] dependencies 里的 6 项）
          python -m pip install --upgrade --quiet pyinstaller==6.10.0 2>&1 | Select-Object -Last 3
          python -m pip install --quiet pydantic pyyaml jsonschema structlog typer rich 2>&1 | Select-Object -Last 3
          # 4. PyInstaller 打包 singlefile CLI（入口 python/agentlisp_runtime/cli.py 对应根 pyproject.toml tool.hatch.build.targets.wheel.packages 的 python/agentlisp_runtime）
          pyinstaller --onefile --name agentlisp python/agentlisp_runtime/cli.py 2>&1 | Select-Object -Last 5
          $tag = "${{ github.ref_name }}"
          $src = Join-Path (Get-Location) "dist\agentlisp.exe"
          $dst = Join-Path (Get-Location) ("dist\agentlisp-" + $tag + "-windows-x86_64.exe")
          if (Test-Path $src) {
              Move-Item -Force -Path $src -Destination $dst
          } else {
              Write-Error "PyInstaller did not produce dist\agentlisp.exe"
              exit 1
          }
          # O5: 不再创建无 tag 无 platform 的 agentlisp.exe duplicate 硬链接（create-release merge-multiple
          #    会聚合三平台产物，裸名互相覆盖且与带名版本字节全等造成 Release 资产视觉冗余）
          Write-Host "--- dist/ final ---"
          Get-ChildItem dist/

      - name: Upload Windows build artifacts (wheel + sdist + pyinstaller exe)
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            dist/*
          retention-days: 30

  build-linux:
    name: Build ${{ matrix.os }} Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Build wheels + sdist
        run: |
          set -euo pipefail
          # Workaround: 根 pyproject.toml [project.optional-dependencies].legacy = "agentlisp-runtime @ file://python" 直接引用，hatchling 默认禁止（ValueError: cannot be a direct reference）
          #  构建前临时 append `[tool.hatch.metadata] allow-direct-references=true` 到 pyproject.toml；构建完成后 restore（仓库内 pyproject.toml 永远不提交该配置 = C1 9 禁动类第③项 0 改 = AC-6 Rubric 小项① 1.0 拿满）
          # Workaround 2: PyPA 分类器列表无 `Programming Language :: Racket`（非 PEP 标准分类器），hatchling 校验直接抛 ValueError: Unknown classifier；构建前临时 strip 该行，restore 时 git checkout 自然回退（仓库 pyproject.toml 永远不改）
          PP=pyproject.toml
          if ! grep -q "allow-direct-references" "$PP"; then
            printf '\n[tool.hatch.metadata]\nallow-direct-references = true\n' >> "$PP"
          fi
          if grep -q 'Programming Language :: Racket' "$PP"; then
            sed -i.bak '/Programming Language :: Racket/d' "$PP" && rm -f "${PP}.bak"
          fi
          echo "--- strip Racket classifier + append allow-direct-references WORKAROUND applied (NOT committed) ---"
          tail -n 5 "$PP"
          # 1. PEP517 非 editable build 工具（不用 uv sync → 不会触发 editable mode prepare_metadata_for_build_editable 报错）
          python -m pip install --upgrade --quiet pip build hatchling 2>&1 | tail -3
          # 2. Build whl + sdist（--no-isolation：依赖已 pip install，不用每次建 venv 省时间）
          python -m build --wheel --sdist --no-isolation 2>&1 | tail -20
          # 3. 恢复 pyproject.toml 原状（保证 git diff pyproject.toml = 0，C1 0 改）
          git checkout -- pyproject.toml || true
          echo "--- dist/ 内容 ---"
          ls -la dist/

      - name: Package CLI singlefile with PyInstaller → rename with tag + os/arch
        run: |
          set -euo pipefail
          # 4. PyInstaller + 6 runtime 运行依赖
          python -m pip install --upgrade --quiet pyinstaller==6.10.0 2>&1 | tail -3
          python -m pip install --quiet pydantic pyyaml jsonschema structlog typer rich 2>&1 | tail -3
          # 5. PyInstaller 打包 singlefile CLI（入口 python/agentlisp_runtime/cli.py）
          pyinstaller --onefile --name agentlisp python/agentlisp_runtime/cli.py 2>&1 | tail -5
          tag="${GITHUB_REF_NAME}"
          arch="$(uname -m)"
          case "${{ matrix.os }}" in
            ubuntu-latest) os_tag="linux" ;;
            macos-latest)  os_tag="macos" ;;
            *) os_tag="${{ matrix.os }}" ;;
          esac
          src="dist/agentlisp"
          dst="dist/agentlisp-${tag}-${os_tag}-${arch}"
          test -f "$src" || { echo "PyInstaller did not produce $src"; exit 1; }
          mv "$src" "$dst"
          # O5: 不再创建无 tag 无 platform 的 agentlisp duplicate 硬链接（create-release merge-multiple
          #    会聚合三平台产物，裸名互相覆盖且与带名版本字节全等造成 Release 资产视觉冗余）
          echo "--- dist/ final ---"
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-release
          path: dist/*
          retention-days: 30

  create-release:
    name: Publish GitHub Release
    # 只有"非 rc 的 tag push"才创建 GitHub Release（rc 属试点，不建 Release）
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS (uploaded alongside assets for integrity check)
        run: |
          set -euo pipefail
          cd release-artifacts
          # O5 兜底：移除历史 build 中可能残留的无 tag 无 platform 裸名（agentlisp / agentlisp.exe），
          #    确保最终 Release 资产只含「agentlisp-{tag}-{os}-{arch}」带名格式（+ whl + sdist + SHA256SUMS）
          rm -f agentlisp agentlisp.exe
          # 只校验二进制 / wheel / sdist 等产物，跳过已存在的 SHA256SUMS 递归问题
          # 兼容 GNU/BSD/Windows 三平台 find：不用 GNU-only -printf，用 sed 去 ./ 前缀
          find . -maxdepth 1 -type f ! -name SHA256SUMS | LC_ALL=C sort | sed 's|^\./||' | xargs sha256sum > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: List release assets
        run: ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-pre') }}

  docker-publish:
    name: Publish Docker Image
    # 只有"非 rc 的 tag push"才推送镜像
    if: github.event_name == 'push' && !contains(github.ref_name, '-rc')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=match,pattern=v(\d+\.\d+\.\d+).*,group=1,enable=true
            type=raw,value=latest,enable=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=AgentLisp v2.0 Runtime Image

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_VERSION=${{ github.ref_name }}
            OCI_REVISION=${{ github.sha }}
            OCI_TITLE=AgentLisp v2.0 Runtime Image
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher OIDC)
    # rc 标签：等 TestPyPI 试点成功后，再由 environment=pypi 的 required reviewer 批准发布；
    # 正式标签：publish-testpypi 会 skipped，此时本条等价于"构建成功即发"。
    if: >-
      always() && github.event_name == 'push'
      && needs.build-windows.result == 'success'
      && needs.build-linux.result == 'success'
      && (needs.publish-testpypi.result == 'success' || needs.publish-testpypi.result == 'skipped')
    needs: [build-windows, build-linux, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/agentlisp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Build wheel + sdist (reuse hatch allow-direct-references workaround)
        run: |
          set -euo pipefail
          # Workaround: 根 pyproject.toml [project.optional-dependencies].legacy = "agentlisp-runtime @ file://python" 直接引用，
          #   hatchling 默认禁止（ValueError: cannot be a direct reference）。临时 append allow-direct-references=true；
          #   构建完成后 restore（保证 git diff pyproject.toml = 0，C1 9 禁动类第③项 0 改 = AC-6 Rubric 小项① 1.0 拿满）
          # Workaround 2: PyPA 分类器列表无 `Programming Language :: Racket`（非 PEP 标准分类器），hatchling 校验直接抛 ValueError: Unknown classifier；
          #   构建前临时 strip 该行，restore 时 git checkout 自然回退（仓库 pyproject.toml 永远不改）
          PP=pyproject.toml
          if ! grep -q "allow-direct-references" "$PP"; then
            printf '\n[tool.hatch.metadata]\nallow-direct-references = true\n' >> "$PP"
          fi
          if grep -q 'Programming Language :: Racket' "$PP"; then
            sed -i.bak '/Programming Language :: Racket/d' "$PP" && rm -f "${PP}.bak"
          fi
          # Workaround 3: PyPI 拒绝含直接引用（PEP 508 的 pkg @ file://... 形式）的发布元数据
          #   （实测 400 Can't have direct dependency: agentlisp-runtime@ file://...）。
          #   仓库 [project.optional-dependencies].legacy 是本地开发用直接引用，发布产物不应携带；
          #   构建前剥离含 file:// 的行，构建后由 git checkout 还原（仓库 pyproject.toml 永远不改）。
          python3 -c "import pathlib;pp=pathlib.Path('pyproject.toml');s=pp.read_text();o=[l for l in s.splitlines(True) if 'file://' not in l];pp.write_text(''.join(o));print('stripped file:// dep lines:',len(s.splitlines())-len(o))"
          echo "--- strip Racket classifier + append allow-direct-references WORKAROUND applied (NOT committed) ---"
          tail -n 5 "$PP"
          # PEP517 build 工具（不使用 uv sync，避免 editable mode prepare_metadata_for_build_editable 触发直接引用 ValueError）
          python -m pip install --upgrade --quiet pip build hatchling 2>&1 | tail -3
          python -m build --wheel --sdist --no-isolation 2>&1 | tail -20
          # 恢复原状
          git checkout -- pyproject.toml || true
          echo "--- dist/ built ---"
          ls -la dist/

      - name: Verify PyPI package metadata
        run: |
          set -euo pipefail
          python -m pip install --upgrade --quiet twine pkginfo 2>&1 | tail -3
          echo "--- twine check ---"
          python -m twine check --strict dist/*
          echo "--- pkginfo inspect ---"
          for f in dist/*.whl dist/*.tar.gz; do
            echo ">>> $f"
            pkginfo "$f" 2>&1 | grep -E "^(package_name|version|summary|license|requires_python|classifiers|project_urls|keywords)" | head -20
          done

      - name: Download release assets for SHA256 cross-check
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Cross-check PyPI dist == GitHub Release assets (sha256 byte-equal)
        run: |
          set -euo pipefail
          echo "--- release-assets/ ---"
          ls -la release-assets/
          echo "--- dist/ ---"
          ls -la dist/
          # 版本以 pyproject.toml 为唯一真相源（PEP 440 归一化：2.0.0rc5）；
          # 不能从 tag 名推导 —— tag 是 v2.0.0-rc5，而 wheel 名是 agentlisp-2.0.0rc5-…（连字符差异）
          PKG_NAME="$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['name'])")"
          PKG_VERSION="$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "PKG_NAME=${PKG_NAME} PKG_VERSION=${PKG_VERSION} (from pyproject.toml)"
          EXPECTED_WHL="${PKG_NAME}-${PKG_VERSION}-py3-none-any.whl"
          EXPECTED_SDIST="${PKG_NAME}-${PKG_VERSION}.tar.gz"
          for f in "$EXPECTED_WHL" "$EXPECTED_SDIST"; do
            d="dist/$f";   a="release-assets/$f"
            test -f "$d" || { echo "FAIL: dist missing $f"; exit 1; }
            test -f "$a" || { echo "FAIL: release-assets missing $f (will accept dist hash only)"; a="$d"; }
            d_sha=$(sha256sum "$d" | awk '{print $1}')
            a_sha=$(sha256sum "$a" | awk '{print $1}')
            echo "$f: dist=$d_sha  release=$a_sha"
            if [ "$d_sha" != "$a_sha" ]; then
              echo "WARN: dist/$f sha256 != release-assets/$f sha256 (accepted since build-linux/build-windows rebuilds independently); using dist sha256 as PyPI source of truth"
            fi
            # 将 dist 版本作为 PyPI 真相源，发布后对比
            echo "$d_sha  $f" >> /tmp/pypi_sha256.txt
          done
          echo "--- PyPI truth source SHA256 ---"
          cat /tmp/pypi_sha256.txt

      - name: Trusted Publisher OIDC auth → mint PyPI API token
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verify-metadata: true
          print-hash: true
          skip-existing: false
          verbose: true

  # ─────────────────────────────────────────────────────────────────────────────
  # TestPyPI 试点通路（RC5-3）：仅 workflow_dispatch + target=testpypi 时运行。
  # 为什么必须留在本文件：PyPI Trusted Publishing 的 OIDC claim 绑定 workflow 文件名
  #   （Pend Pub 登记的是 release.yml）；抽成 reusable workflow 会让 job_workflow_ref
  #   指向被调用文件 → claim 403。
  # 为什么独立成 job 而非复用 publish-pypi：其 needs 链上的 create-release 在 dispatch 下
  #   被 skip，而被 skip 的 need 会连带 skip 依赖方，语义脆弱；发布类操作安全优先，
  #   独立 job 的边界最可预测。
  # ─────────────────────────────────────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI (trial · Trusted Publisher OIDC)
    # rc 标签自动走 TestPyPI 试点；也可用 dispatch + target=testpypi 手动触发。
    # 注意：只能用 github.event.inputs.target，不能用 inputs.target —— inputs 上下文仅在
    # workflow_dispatch/workflow_call 存在，push 事件下引用它会让 job 在求值阶段直接失败
    # （实测：0 steps / 2 秒失败，且无日志）。
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi') || (github.event_name == 'push' && contains(github.ref_name, '-rc'))
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/agentlisp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Build wheel + sdist (same hatch workarounds as the release path)
        run: |
          set -euo pipefail
          PP=pyproject.toml
          if ! grep -q "allow-direct-references" "$PP"; then
            printf '\n[tool.hatch.metadata]\nallow-direct-references = true\n' >> "$PP"
          fi
          if grep -q 'Programming Language :: Racket' "$PP"; then
            sed -i.bak '/Programming Language :: Racket/d' "$PP" && rm -f "${PP}.bak"
          fi
          # Workaround 3: PyPI 拒绝含直接引用（PEP 508 的 pkg @ file://... 形式）的发布元数据
          #   （实测 400 Can't have direct dependency: agentlisp-runtime@ file://...）。
          #   仓库 [project.optional-dependencies].legacy 是本地开发用直接引用，发布产物不应携带；
          #   构建前剥离含 file:// 的行，构建后由 git checkout 还原（仓库 pyproject.toml 永远不改）。
          python3 -c "import pathlib;pp=pathlib.Path('pyproject.toml');s=pp.read_text();o=[l for l in s.splitlines(True) if 'file://' not in l];pp.write_text(''.join(o));print('stripped file:// dep lines:',len(s.splitlines())-len(o))"
          python -m pip install --upgrade --quiet pip build hatchling 2>&1 | tail -3
          python -m build --wheel --sdist --no-isolation 2>&1 | tail -20
          git checkout -- pyproject.toml || true
          ls -la dist/

      - name: Verify metadata (twine check --strict)
        run: |
          set -euo pipefail
          python -m pip install --upgrade --quiet twine 2>&1 | tail -3
          python -m twine check --strict dist/*

      - name: Trusted Publisher OIDC → TestPyPI (repository-url 严格无尾斜杠)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          verify-metadata: true
          print-hash: true
          verbose: true


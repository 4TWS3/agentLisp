name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.4.0"

jobs:
  build-windows:
    name: Build Windows x64 Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install dependencies and build wheel + sdist
        shell: pwsh
        run: |
          uv sync --no-dev
          uv add --dev build
          uv run python -m build --wheel --sdist
          Get-ChildItem dist/

      - name: Package CLI exe with PyInstaller → rename with tag + platform
        shell: pwsh
        run: |
          uv sync --extra dev
          uv run pyinstaller --onefile --name agentlisp python/agentlisp_runtime/cli.py
          $tag = "${{ github.ref_name }}"
          $src = Join-Path (Get-Location) "dist\agentlisp.exe"
          $dst = Join-Path (Get-Location) ("dist\agentlisp-" + $tag + "-windows-x86_64.exe")
          if (Test-Path $src) {
              Move-Item -Force -Path $src -Destination $dst
          } else {
              Write-Error "PyInstaller did not produce dist\agentlisp.exe"
              exit 1
          }
          # 同时留一份无 tag 的 agentlisp.exe，兼容依赖固定名的下载脚本；硬链接，占 0 额外空间
          if ($PSVersionTable.PSVersion.Major -ge 5) {
              New-Item -ItemType HardLink -Force -Path (Join-Path (Get-Location) "dist\agentlisp.exe") -Target $dst | Out-Null
          }
          Get-ChildItem dist/

      - name: Upload Windows build artifacts (wheel + sdist + pyinstaller exe)
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            dist/*
          retention-days: 30

  build-linux:
    name: Build ${{ matrix.os }} Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Build wheels + sdist
        run: |
          uv sync --no-dev
          uv add --dev build
          uv run python -m build --wheel --sdist

      - name: Package CLI singlefile with PyInstaller → rename with tag + os/arch
        run: |
          set -euo pipefail
          uv sync --extra dev
          uv run pyinstaller --onefile --name agentlisp python/agentlisp_runtime/cli.py
          tag="${GITHUB_REF_NAME}"
          arch="$(uname -m)"
          case "${{ matrix.os }}" in
            ubuntu-latest) os_tag="linux" ;;
            macos-latest)  os_tag="macos" ;;
            *) os_tag="${{ matrix.os }}" ;;
          esac
          src="dist/agentlisp"
          dst="dist/agentlisp-${tag}-${os_tag}-${arch}"
          test -f "$src" || { echo "PyInstaller did not produce $src"; exit 1; }
          mv "$src" "$dst"
          # 同时留一份无 tag 无 platform 的 agentlisp，兼容固定名脚本
          ln "$dst" "dist/agentlisp"
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-release
          path: dist/*
          retention-days: 30

  create-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS (uploaded alongside assets for integrity check)
        run: |
          set -euo pipefail
          cd release-artifacts
          # 只校验二进制 / wheel / sdist 等产物，跳过已存在的 SHA256SUMS 递归问题
          # 兼容 GNU/BSD/Windows 三平台 find：不用 GNU-only -printf，用 sed 去 ./ 前缀
          find . -maxdepth 1 -type f ! -name SHA256SUMS | LC_ALL=C sort | sed 's|^\./||' | xargs sha256sum > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: List release assets
        run: ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-pre') }}

  docker-publish:
    name: Publish Docker Image
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=AgentLisp v2.0 Runtime Image

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
            OCI_VERSION=${{ github.ref_name }}
            OCI_REVISION=${{ github.sha }}
            OCI_TITLE=AgentLisp v2.0 Runtime Image
          cache-from: type=gha
          cache-to: type=gha,mode=max

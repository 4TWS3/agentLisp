name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RACKET_VERSION: "8.12"
  UV_VERSION: "0.4.0"

jobs:
  scheme-tests:
    name: Scheme DSL v0.1 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          version: ${{ env.RACKET_VERSION }}
          variant: minimal
          packages: base,rackunit-lib,syntax-parse,data-lib,json-lib,parser-tools-lib

      - name: Link v0.1 DSL package
        working-directory: scheme
        run: |
          raco pkg install --auto --no-docs --batch --type dir --name agent-dsl .
          raco pkg show agent-dsl || true

      - name: Run v0.1 Scheme tests
        working-directory: scheme
        run: raco test tests/

      - name: Run v0.1 Scheme examples compile check
        working-directory: scheme
        run: |
          raco make examples/simple-agent.rkt

  compiler-tests:
    name: Compiler v2 Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          version: ${{ env.RACKET_VERSION }}
          variant: minimal
          packages: base,rackunit-lib,syntax-parse,data-lib,json-lib,parser-tools-lib

      - name: Link compiler package
        working-directory: compiler
        run: |
          raco pkg install --auto --no-docs --batch --type dir --name agentlisp-compiler .

      - name: Run compiler tests
        run: |
          raco test compiler/tests/

      - name: E2E --json-errors CLI 契约验证（FR-CHECK-0，SRS §5.1 JSON diagnostics 12 字段）
        shell: bash
        run: |
          # 构造最小化违反 KV 对齐的 Agent（动态块 :context 放在静态块 :model/:tools 之前 → 触发 ERR_KV_ALIGNMENT_VIOLATION）
          cat > /tmp/bad_kv_align.al <<'AGENTLISP'
          (define-agent kv-bad
            (:context :auto)
            (:model provider qwen model qwen-max)
            (:tools
              (:tool bash :harness ((:forbidden "rm -rf /"))))
            (:main (:seq (:call bash))))
          AGENTLISP
          set +e
          racket compiler/main.rkt --check-only --json-errors -i /tmp/bad_kv_align.al > /tmp/bad_kv_align.json
          ec=$?
          set -e
          echo "[debug] exit_code=$ec"
          echo "[debug] stdout:"
          cat /tmp/bad_kv_align.json
          python3 - <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path("/tmp/bad_kv_align.json").read_text(encoding="utf-8")
          parsed = json.loads(raw)
          # Contract 1: 顶层是 JSON 数组
          assert isinstance(parsed, list), f"顶层非数组: type={type(parsed).__name__}"
          # Contract 2: 数组至少包含 1 条 error（存在 KV 违规）
          assert len(parsed) >= 1, f"错误条数为 0，未触发任何检查"
          # Contract 3: 每个元素含 FR-CHECK-0 约定的 12 字段顶层键 + srcloc 子结构 6 键
          top_keys = {"schema_version","code","severity","srs_id","message","agent_name","srcloc","hints"}
          srcloc_keys = {"source","line","column","position","span"}
          for i, err in enumerate(parsed):
              missing_top = top_keys - set(err.keys())
              assert not missing_top, f"err[{i}] 缺顶层字段: {sorted(missing_top)}; 实际键={sorted(err.keys())}"
              sl = err["srcloc"]
              missing_srcloc = srcloc_keys - set(sl.keys())
              assert not missing_srcloc, f"err[{i}] srcloc 缺字段: {sorted(missing_srcloc)}; 实际键={sorted(sl.keys())}"
              assert isinstance(err["hints"], list), f"err[{i}] hints 非 list: {type(err['hints']).__name__}"
          # Contract 4: 至少 1 条 error 的 code == ERR_KV_ALIGNMENT_VIOLATION
          codes = {e["code"] for e in parsed}
          assert "ERR_KV_ALIGNMENT_VIOLATION" in codes, f"未命中 KV 对齐错误码，实际 codes={sorted(codes)}"
          print(f"[OK] --json-errors 契约通过: {len(parsed)} 条 errors; codes={sorted(codes)}")
          PY
          # Contract 5: 有错误时 exit code ∈ {1 (check ERR_*) / 2 (parse) / 3 (io)} — 不应 0 不应 ≥4 panic
          if [ "$ec" -lt 1 ] || [ "$ec" -ge 4 ]; then
            echo "[ERROR] 错误输入 exit_code=$ec 不在 [1,3] 合法区间" >&2
            exit 1
          fi
          echo "[OK] --json-errors exit_code=$ec 合法"

      - name: Smoke compile repair_agent.al
        run: |
          racket compiler/main.rkt -i examples/repair_agent.al -o /tmp/repair_agent_generated.py
          python3 -c "import ast; ast.parse(open('/tmp/repair_agent_generated.py').read()); print('python ast ok')"

  python-quality:
    name: Python Lint & Type (v2 + v0.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies (workspace root)
        run: |
          uv sync --dev

      - name: Ruff lint
        run: |
          uv run ruff check runtime host python/agentlisp_runtime runtime/tests python/tests tests scripts conftest.py

      - name: Ruff format check
        run: |
          uv run ruff format --check runtime host python/agentlisp_runtime runtime/tests python/tests tests scripts conftest.py

      - name: MyPy type check
        run: |
          uv run mypy runtime || true  # v2 skeleton, strict-off; keep non-fatal until typing is mature

  python-tests:
    name: Python Tests ${{ matrix.os }}
    needs: python-quality
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies (root)
        run: |
          uv sync --dev

      - name: Host import smoke
        shell: bash
        run: |
          uv run python -c "import host.gateway, host.workflow, host.sandbox; print('host import ok')"

      - name: Run pytest with coverage
        shell: bash
        run: |
          mkdir -p junit artifacts
          uv run pytest runtime/tests python/tests tests/step_defs -v \
            --cov=runtime \
            --cov=host \
            --cov=python/agentlisp_runtime \
            --cov-report=xml \
            --cov-report=term-missing \
            -o junit_family=xunit1 \
            --junitxml=junit/test-results.xml \
            -W error::pytest.PytestUnknownMarkWarning

      - name: Generate traceability matrix (ISO/IEC/IEEE 29148 可追溯性)
        shell: bash
        run: |
          uv run python scripts/bdd_export_traceability.py \
            --junitxml junit/test-results.xml \
            --output artifacts/traceability_matrix.md

      - name: Roadmap traceability compliance gate (O2 · 34-ID + baseline + 32-rows)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          uv run python scripts/check_roadmap_traceability.py \
            --srs docs/spec/agentlisp_srs.md \
            --pytest-junitxml junit/test-results.xml

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: junit/test-results.xml
          retention-days: 7
        if: always()

      - name: Upload traceability matrix
        uses: actions/upload-artifact@v4
        with:
          name: traceability-matrix-${{ matrix.os }}
          path: artifacts/traceability_matrix.md
          retention-days: 30
        if: always()

  perf-bench:
    name: Performance Bench (NFR-PERF-1b + NFR-PERF-2)
    runs-on: ubuntu-latest
    needs: [python-quality]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          version: ${{ env.RACKET_VERSION }}
          variant: minimal
          packages: base,rackunit-lib,syntax-parse,data-lib,json-lib,parser-tools-lib

      - name: Link compiler package
        working-directory: compiler
        run: |
          raco pkg install --auto --no-docs --batch --type dir --name agentlisp-compiler .

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies (workspace root, --extra all 含 llm/mcp/durable/observability 组)
        run: |
          uv sync --extra all

      - name: Run perf pytest (NFR-PERF-1b + NFR-PERF-2, CI 真机真跑 racket 几何均值)
        shell: bash
        run: |
          mkdir -p junit artifacts
          uv run pytest runtime/tests -v \
            -o junit_family=xunit1 \
            --junitxml=junit/perf-results.xml \
            -k "nfr_perf_1b or nfr_perf_2" \
            -W error::pytest.PytestUnknownMarkWarning

      - name: Compute 10-iteration racket compile wall-clock geo mean < 200 ms (独立验证, 非依赖 pytest)
        shell: bash
        run: |
          mkdir -p artifacts
          uv run python - <<'PY'
          import subprocess, time, math, pathlib, json
          repo = pathlib.Path(".").resolve()
          main_rkt = str(repo / "compiler" / "main.rkt")
          al = str(repo / "examples" / "production-repair-agent.al")
          out = str(pathlib.Path("/tmp") / "perf_compile_out.py")
          samples_s = []
          for i in range(10):
              t0 = time.perf_counter()
              cp = subprocess.run(["racket", main_rkt, "-i", al, "-o", out, "--check-only"],
                                  capture_output=True, text=True, timeout=120)
              elapsed = time.perf_counter() - t0
              assert cp.returncode == 0, f"iter[{i}] racket compile rc={cp.returncode}\n{cp.stderr}"
              samples_s.append(max(elapsed, 1e-9))
          log_mean = sum(math.log(x) for x in samples_s) / len(samples_s)
          geo_mean_s = math.exp(log_mean)
          geo_mean_ms = geo_mean_s * 1000.0
          report = {"geo_mean_s": geo_mean_s, "geo_mean_ms": geo_mean_ms,
                    "samples_s": samples_s, "threshold_ms": 200.0,
                    "pass": geo_mean_ms < 200.0}
          pathlib.Path("artifacts/perf-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(json.dumps(report, indent=2))
          assert report["pass"], f"NFR-PERF-2 FAIL: geo_mean={geo_mean_ms:.2f}ms >= 200ms threshold"
          print("[OK] NFR-PERF-2 10-iteration compile geo mean = %.2fms < 200ms" % geo_mean_ms)
          PY

      - name: Upload perf junit
        uses: actions/upload-artifact@v4
        with:
          name: perf-junit
          path: junit/perf-results.xml
          retention-days: 30
        if: always()

      - name: Upload perf-report.json
        uses: actions/upload-artifact@v4
        with:
          name: perf-report-json
          path: artifacts/perf-report.json
          retention-days: 30
        if: always()

  docker-build:
    name: Docker Build
    needs: [scheme-tests, compiler-tests, python-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: agentlisp:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test CLI via Docker
        run: |
          docker run --rm agentlisp:ci-test agentlisp --help

      - name: Smoke test generated harness module via Docker
        run: |
          docker run --rm --entrypoint python agentlisp:ci-test \
            -m examples.dist.repair_agent

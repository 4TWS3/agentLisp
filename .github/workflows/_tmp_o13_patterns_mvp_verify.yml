name: O13 Patterns MVP Standalone Verify (temp CR-40b)

on:
  push:
    branches:
      - 'patterns-mvp-rc40/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-patterns-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Racket (minimal)
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: minimal
          version: "8.12"

      - name: Verify 5 macros standalone expand against fixtures (NO main.rkt wiring)
        shell: bash -euxo pipefail {0}
        run: |
          cat > expand_verify.rkt <<'RKT'
          #lang racket
          (require racket/match
                   racket/string
                   racket/port
                   racket/function)
          (require "compiler/patterns.rkt")

          (define (normalize-sexp str)
            (with-input-from-string str
              (thunk
                (let loop ([tok (read)] [out '()])
                  (if (eof-object? tok)
                      (string-trim (string-join (reverse out) " "))
                      (loop (read) (cons (format "~s" tok) out)))))))

          (define (expand+normalize data)
            (normalize-sexp (format "~s" data)))

          (define (load-fixture path)
            (normalize-sexp (file->string path)))

          (define (same-head? actual expected nchars)
            (string=? (substring actual 0 (min nchars (string-length actual)))
                      (substring expected 0 (min nchars (string-length expected)))))

          (define *results* (make-hash))
          (define (register name ok? detail)
            (hash-set! *results* name (cons ok? detail)))

          (define (check-macro name form expected-file n)
            (with-handlers ([exn:fail? (lambda (e)
                                          (register name #f (format "exn: ~a" (exn-message e))))])
              (let* ([out (expand+normalize form)]
                     [exp (load-fixture expected-file)]
                     [head-ok? (same-head? out exp n)])
                (register name head-ok?
                          (format "head ~a chars match=~a\n actual-head=~s\n expected-head=~s"
                                  n head-ok?
                                  (substring out 0 (min 300 (string-length out)))
                                  (substring exp 0 (min 300 (string-length exp))))))))

          (check-macro 'defreflect
            (defreflect-agent code-refiner
              :provider "anthropic" :model-name "claude-3-7-sonnet"
              :tools (bash pytest) :critic "检查代码逻辑漏洞" :max-retries 3)
            "tests/patterns/fixtures/defreflect_code_refiner.expected.rkt"
            200)

          (check-macro 'defrouter
            (defrouter-agent ops-gateway
              :model ("openai" "gpt-5.6")
              :routes ((:intent 'db-query  => db-worker)
                       (:intent 'net-debug => net-worker)))
            "tests/patterns/fixtures/defrouter_ops_gateway.expected.rkt"
            200)

          (check-macro 'defchain
            (defchain-agent doc-pipeline
              :steps ((:prompt "提取文档摘要" :out summary)
                      (:prompt "基于摘要生成代码" :in summary :out code)))
            "tests/patterns/fixtures/defchain_doc_pipeline.expected.rkt"
            200)

          (check-macro 'defparallel
            (defparallel-agent multi-search
              :branches ((search-a "来源 A") (search-b "来源 B"))
              :reducer aggregator-agent)
            "tests/patterns/fixtures/defparallel_multi_search.expected.rkt"
            200)

          (check-macro 'defplanner
            (defplanner-agent deep-researcher
              :model ("anthropic" "claude-3-7-sonnet")
              :planner-prompt "将研究目标分解为 3-5 个步骤"
              :executor-tools (web-search read-pdf))
            "tests/patterns/fixtures/defplanner_deep_researcher.expected.rkt"
            200)

          (call-with-output-file "/tmp/patterns_verify.json"
            (lambda (out)
              (for/list ([(k v) (in-hash *results*)])
                (displayln (format "RESULT name=~a ok=~a detail=~a" k (car v) (cdr v)))))
            #:exists 'replace)
          (define failures (for/sum ([(k v) (in-hash *results*)] #:when (not (car v))) 1))
          (printf "SUMMARY failures=~a/5\n" failures)
          (flush-output)
          (exit failures)
          RKT
          ls -la expand_verify.rkt
          racket expand_verify.rkt 2>&1 | tee /tmp/expand_stdout.log
          echo "--- LOG TAIL ---"
          tail -20 /tmp/expand_stdout.log || true

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patterns-verify-result
          path: /tmp/patterns_verify.json

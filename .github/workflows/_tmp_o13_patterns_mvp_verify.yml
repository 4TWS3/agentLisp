name: O13 Patterns MVP Standalone Verify (temp CR-40b)

on:
  push:
    branches:
      - 'patterns-mvp-rc40/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-patterns-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Racket (full)
        uses: Bogdanp/setup-racket@v1.11
        with:
          architecture: x64
          distribution: full
          version: "8.12"

      - name: Quick syntax/load diagnostics
        shell: bash -euxo pipefail {0}
        run: |
          echo "-- Step A: bracket diff via python --"
          python3 scripts/_tmp_bracket_diff.py compiler/main.rkt 2>&1 | tee /tmp/diff_main.log || true
          python3 scripts/_tmp_bracket_diff.py compiler/patterns.rkt 2>&1 | tee /tmp/diff_pat.log || true
          echo "-- Step B: load patterns.rkt standalone --"
          racket -e "(require (file \"$(pwd)/compiler/patterns.rkt\")) (displayln \"PATTERNS OK\")" 2>&1 | tee /tmp/pat_load.log || true
          echo "-- Step C: print lines 190-260 main.rkt (cat -n) --"
          awk 'NR>=190 && NR<=260 {printf "%d:\t%s\n", NR, $0}' compiler/main.rkt
          echo "-- Step D: raco expand of main.rkt head lines only (up to 2048 chars) --"
          racket -e "(with-input-from-file \"compiler/main.rkt\" (thunk (let loop ([n 0] [sz 0]) (define l (read-line (current-input-port) 'any)) (cond [(or (eof-object? l) (> sz 8192)) (displayln (format \"ok lines ~a sz ~a\" n sz))] [else (loop (+ n 1) (+ sz (string-length l)))])))" 2>&1 | tee /tmp/read_lines.log || true
          echo "-- Step E: raco make main.rkt --"
          raco make compiler/main.rkt 2>&1 | tee /tmp/raco_make.log || true

      - name: Verify 5 macros standalone expand against fixtures (NO main.rkt wiring)
        shell: bash -euxo pipefail {0}
        run: |
          cat > expand_verify.rkt <<'ENDOFRACKET'
          #lang racket
          (require racket/match
                   racket/string
                   racket/port
                   racket/function)
          (require "compiler/patterns.rkt")

          (define (normalize-sexp str)
            (with-input-from-string str
              (thunk
                (let loop ([tok (read)] [out '()])
                  (if (eof-object? tok)
                      (string-trim (string-join (reverse out) " "))
                      (loop (read) (cons (format "~s" tok) out)))))))

          (define (expand+normalize data)
            (normalize-sexp (format "~s" data)))

          (define (load-fixture path)
            (normalize-sexp (file->string path)))

          (define (same-head? actual expected nchars)
            (string=? (substring actual 0 (min nchars (string-length actual)))
                      (substring expected 0 (min nchars (string-length expected)))))

          (define *results* (make-hash))
          (define (register name ok? detail)
            (hash-set! *results* name (cons ok? detail)))

          (define (check-macro name form expected-file n)
            (with-handlers ([exn:fail? (lambda (e)
                                          (register name #f (format "exn: ~a" (exn-message e))))])
              (let* ([out (expand+normalize form)]
                     [exp (load-fixture expected-file)]
                     [head-ok? (same-head? out exp n)])
                (register name head-ok?
                          (format "head ~a chars match=~a\n actual-head=~s\n expected-head=~s"
                                  n head-ok?
                                  (substring out 0 (min 300 (string-length out)))
                                  (substring exp 0 (min 300 (string-length exp))))))))

          (check-macro 'defreflect
            (defreflect-agent code-refiner
              :provider "anthropic" :model-name "claude-3-7-sonnet"
              :tools (bash pytest) :critic "检查代码逻辑漏洞" :max-retries 3)
            "tests/patterns/fixtures/defreflect_code_refiner.expected.rkt"
            200)

          (check-macro 'defrouter
            (defrouter-agent ops-gateway
              :model ("openai" "gpt-5.6")
              :routes ((:intent 'db-query  => db-worker)
                       (:intent 'net-debug => net-worker)))
            "tests/patterns/fixtures/defrouter_ops_gateway.expected.rkt"
            200)

          (check-macro 'defchain
            (defchain-agent doc-pipeline
              :steps ((:prompt "提取文档摘要" :out summary)
                      (:prompt "基于摘要生成代码" :in summary :out code)))
            "tests/patterns/fixtures/defchain_doc_pipeline.expected.rkt"
            200)

          (check-macro 'defparallel
            (defparallel-agent multi-search
              :branches ((search-a "来源 A") (search-b "来源 B"))
              :reducer aggregator-agent)
            "tests/patterns/fixtures/defparallel_multi_search.expected.rkt"
            200)

          (check-macro 'defplanner
            (defplanner-agent deep-researcher
              :model ("anthropic" "claude-3-7-sonnet")
              :planner-prompt "将研究目标分解为 3-5 个步骤"
              :executor-tools (web-search read-pdf))
            "tests/patterns/fixtures/defplanner_deep_researcher.expected.rkt"
            200)

          (call-with-output-file "/tmp/patterns_verify.json"
            (lambda (out)
              (for/list ([(k v) (in-hash *results*)])
                (displayln (format "RESULT name=~a ok=~a detail=~a" k (car v) (cdr v)) out)))
            #:exists 'replace)
          (for/list ([(k v) (in-hash *results*)])
            (displayln (format "RESULT name=~a ok=~a" k (car v))))
          (define failures (for/sum ([(k v) (in-hash *results*)] #:when (not (car v))) 1))
          (printf "SUMMARY failures=~a/5\n" failures)
          (flush-output)
          (exit failures)
          ENDOFRACKET
          ls -la expand_verify.rkt
          racket expand_verify.rkt 2>&1 | tee /tmp/expand_stdout.log
          echo "--- expand LOG TAIL ---"
          tail -20 /tmp/expand_stdout.log || true

      - name: Setup Python (for pytest patterns cases)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        shell: bash -euxo pipefail {0}
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest pytest-bdd ruff pytest-cov
          python3 -m pip install -e . 2>&1 | tail -3 || true

      - name: Run pytest patterns cases
        shell: bash -euxo pipefail {0}
        run: |
          export PYTHONPATH=$(pwd):$(pwd)/tests
          which racket && racket --version
          echo "-- Sanity dump-ast defreflect 300 chars --"
          racket compiler/main.rkt --dump-ast tests/patterns/fixtures/defreflect_code_refiner.al > /tmp/sanity_ast.txt 2>&1 || echo "SANITY racket exit=$? (non-fatal)"
          head -c 300 /tmp/sanity_ast.txt
          echo
          echo "-- V2 AST gate: Core AST 合法性（镜像 parser 白名单/枚举，无需 Racket）--"
          python3 scripts/check_patterns_v2_ast.py
          echo
          echo "-- Now full pytest patterns suite (V1 5 + V2 10 + NFR01/02 15+15=30 parametrize, 约 10+30+15+15=70 patterns pytest cases) --"
          python3 -m pytest tests/patterns/test_pattern_checker.py tests/patterns/test_pattern_checker_v2.py -v 2>&1 | tee /tmp/pytest_patterns.log
          echo "===== pytest patterns summary tail 20 ====="
          tail -20 /tmp/pytest_patterns.log

      - name: Run RackUnit patterns MVP (V1 5/5 + V2 10/10 合计 15 RackUnit 全绿)
        shell: bash -euxo pipefail {0}
        run: |
          cd compiler/tests
          raco test test_patterns_mvp.rkt 2>&1 | tee /tmp/rackunit_patterns.log
          echo "===== RackUnit V1 patterns summary tail 10 ====="
          tail -10 /tmp/rackunit_patterns.log
          raco test test_patterns_v2_mvp.rkt 2>&1 | tee /tmp/rackunit_v2_patterns.log
          echo "===== RackUnit V2 patterns summary tail 10 ====="
          tail -10 /tmp/rackunit_v2_patterns.log

      # 报告型闸门（continue-on-error）：本步骤暴露的是 **C1 冻结文件内的既存缺陷**，与 CR-41 模式层无关：
      #   ① compiler/agentlisp_compiler.rkt 括号不平衡（par=-2：L119 / L692 各多一个 ")"）→ 文件无法被 Racket 读取
      #   ② compiler/checker.rkt:102 (struct srcloc* … #:transparent #:prefab) → 8.12 报 multiple inspector specs（即 GAP-1）
      #   ③ compiler/parser.rkt:54 (al-agent name purpose tools workflows hooks) 5 参 vs 6 字段 → CLI 编译路径对任何 .al 都 arity mismatch
      # 修 ①②③ 需改 C1 禁动类（AC-6 diff≠0）→ 待 Owner 批准，故本步骤只报告不阻塞。
      - name: V2 end-to-end compile probe (报告型：C1-blocked，非阻塞)
        continue-on-error: true
        shell: bash -euxo pipefail {0}
        run: |
          ok=0; fail=0
          for f in tests/patterns/fixtures_v2/*.al; do
            if racket compiler/main.rkt -i "$f" -o /tmp/v2out.py > /tmp/v2compile.log 2>&1; then
              ok=$((ok+1))
            else
              fail=$((fail+1)); echo "COMPILE FAIL: $f"; tail -15 /tmp/v2compile.log
            fi
          done
          echo "V2-COMPILE ok=$ok fail=$fail (C1-blocked，非阻塞)"
          echo "== 正规通路探测 compile-agent-lisp（旁路 legacy parser.rkt）=="
          racket compiler/tools/check_v2_compile.rkt 2>&1 | tail -12 || true
          echo "-- V1 已知缺陷登记（CR-42 阻断项，本 Job 不阻塞）--"
          v1ok=0; v1fail=0
          for f in tests/patterns/fixtures/defreflect_code_refiner.al tests/patterns/fixtures/defrouter_ops_gateway.al tests/patterns/fixtures/defchain_doc_pipeline.al tests/patterns/fixtures/defparallel_multi_search.al tests/patterns/fixtures/defplanner_deep_researcher.al; do
            if racket compiler/main.rkt -i "$f" -o /tmp/v1out.py > /tmp/v1compile.log 2>&1; then v1ok=$((v1ok+1)); else v1fail=$((v1fail+1)); echo "V1-COMPILE FAIL: $f"; tail -5 /tmp/v1compile.log; fi
          done
          echo "V1-COMPILE ok=$v1ok fail=$v1fail (CR-42 已知：V1 宏产物含非白名单 harness 键)"
          echo "C1-BLOCKED: agentlisp_compiler par=-2 / checker.rkt srcloc* / parser.rkt al-agent arity 5v6（待 Owner 批准修复）"

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patterns-verify-result
          path: |
            /tmp/patterns_verify.json
            /tmp/diff_*.log
            /tmp/pat_load.log
            /tmp/read_lines.log
            /tmp/raco_make.log
            /tmp/pytest_patterns.log
            /tmp/rackunit_patterns.log
            /tmp/rackunit_v2_patterns.log
